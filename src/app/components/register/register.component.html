<section class="flex flex-col lg:flex-row min-h-screen">
  <!-- Left: Form Section -->
  <div class="flex flex-col justify-center items-center w-full lg:w-1/2 px-6 py-8 custom-background">
    <div class="w-full bg-white rounded-lg shadow sm:max-w-md xl:p-0">
      <div class="p-6 space-y-6 sm:p-8">
        <h1 class="text-2xl font-bold leading-tight tracking-tight text-center register-title">
          Бүртгүүлэх
        </h1>
        <form class="space-y-6" (ngSubmit)="onRegister()">
          <!-- <p-selectButton 
            [options]="stateOptions" 
            [(ngModel)]="role" 
            name="role"
            optionLabel="label" 
            optionValue="value" 
            allowEmpty="false"
            styleClass="custom-selection"
            (click)="onRoleChange()" />
          
          <div *ngIf="role !== 'teacher'">
            <label class="block mb-2 text-sm font-medium register-text">Багш</label>
            <p-dropdown 
              styleClass="custom-drop"
              [options]="teachers" 
              [(ngModel)]="selectedTeacher" 
              optionLabel="username"
              optionValue="_id"
              placeholder="Багш сонгох"
              [filter]="true" />
          </div> -->

          <div>
            <label for="firstName" class="block mb-2 text-sm font-medium register-text">Нэр</label>
            <input [(ngModel)]="firstName" type="text" name="firstName" id="firstName"
              class="input-style block w-full p-2.5 sm:text-sm"
              placeholder="Нэр" required>
          </div>

          <div>
            <label for="lastName" class="block mb-2 text-sm font-medium register-text">Овог</label>
            <input [(ngModel)]="lastName" type="text" name="lastName" id="lastName"
              class="input-style block w-full p-2.5 sm:text-sm"
              placeholder="Овог" required>
          </div>

          <div>
            <label for="email" class="block mb-2 text-sm font-medium register-text">И-майл</label>
            <input [(ngModel)]="email" type="email" name="email" id="email"
              class="input-style block w-full p-2.5 sm:text-sm"
              placeholder="name@company.com" required>
          </div>

          <div>
            <label for="password" class="block mb-2 text-sm font-medium register-text">Нууц үг</label>
            <input [(ngModel)]="password" type="password" name="password" id="password"
              class="input-style block w-full p-2.5 sm:text-sm"
              placeholder="••••••••" required>
          </div>

          <div>
            <label for="confirm-password" class="block mb-2 text-sm font-medium register-text">Нууц үг баталгаажуулах</label>
            <input [(ngModel)]="confirmPassword" type="password" name="confirm-password" id="confirm-password"
              class="input-style block w-full p-2.5 sm:text-sm"
              placeholder="••••••••" required>
          </div>

          <button type="submit"
            class="w-full text-white font-medium rounded-lg text-sm px-5 py-2.5 text-center register-button hover:bg-sky-700 focus:outline-none focus:ring-4 focus:ring-sky-300">
            Бүртгүүлэх
          </button>

          <p class="text-sm font-light text-center register-text">
            Бүртгэлтэй юу? <a href="#" class="font-medium underline cursor-pointer register-text">Нэвтрэх</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <!-- Right: Background Image -->
  <div class="relative hidden lg:flex w-full lg:w-1/2 register-background">
    <img src="../../../assets/images/register-background.png" class="object-cover w-full h-full" alt="Background">
    <img src="../../../assets/images/main-black 2.svg" class="main-logo" alt="Main Logo">
  </div>
</section>
