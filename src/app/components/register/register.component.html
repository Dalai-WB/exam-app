<section class="flex flex-col lg:flex-row min-h-screen">

  <!-- LEFT: FORM -->
  <div
    class="flex flex-col items-center justify-start
           w-full lg:w-1/2
           overflow-y-auto
           px-4 sm:px-6 md:px-8
           py-6 sm:py-8
           custom-background">
    <div
      class="w-full
             sm:max-w-md md:max-w-lg
             bg-white rounded-lg shadow-xl"
    >
      <div class="p-6 sm:p-8 space-y-5 sm:space-y-6">

        <h1
          class="text-xl sm:text-2xl
                 font-bold text-center register-title"
        >
          Бүртгүүлэх
        </h1>

        <form class="space-y-5 sm:space-y-6" (ngSubmit)="onRegister()">

          <!-- ROLE -->
          <p-selectButton
            [options]="stateOptions"
            [(ngModel)]="role"
            name="role"
            optionLabel="label"
            optionValue="value"
            allowEmpty="false"
            styleClass="custom-selection w-full"
            (click)="onRoleChange()">
          </p-selectButton>

          <!-- TEACHER SELECT -->
          <div *ngIf="role !== 'teacher'">
            <label class="block mb-2 text-sm font-medium register-text">
              Багш
            </label>
            <p-dropdown
              name="selectedTeacher"
              styleClass="custom-drop w-full"
              [options]="teachers"
              [(ngModel)]="selectedTeacher"
              optionLabel="username"
              optionValue="_id"
              placeholder="Багш сонгох"
              [filter]="true">
            </p-dropdown>
          </div>

          <!-- FIRST NAME -->
          <div>
            <label class="block mb-2 text-sm font-medium register-text">
              Нэр
            </label>
            <input
              [(ngModel)]="firstName"
              type="text"
              name="firstName"
              class="input-style w-full p-2.5 text-sm sm:text-base"
              placeholder="Нэр"
              required>
          </div>

          <!-- LAST NAME -->
          <div>
            <label class="block mb-2 text-sm font-medium register-text">
              Овог
            </label>
            <input
              [(ngModel)]="lastName"
              type="text"
              name="lastName"
              class="input-style w-full p-2.5 text-sm sm:text-base"
              placeholder="Овог"
              required>
          </div>

          <!-- EMAIL -->
          <div>
            <label class="block mb-2 text-sm font-medium register-text">
              И-мэйл
            </label>
            <input
              [(ngModel)]="email"
              type="email"
              name="email"
              class="input-style w-full p-2.5 text-sm sm:text-base"
              placeholder="И-мэйлээ оруулна уу"
              required>
          </div>

          <!-- PASSWORD -->
          <div>
            <label class="block mb-2 text-sm font-medium register-text">
              Нууц үг
            </label>
            <input
              [(ngModel)]="password"
              type="password"
              name="password"
              class="input-style w-full p-2.5 text-sm sm:text-base"
              placeholder="Нууц үгээ оруулна уу"
              required>
          </div>

          <!-- CONFIRM PASSWORD -->
          <div>
            <label class="block mb-2 text-sm font-medium register-text">
              Нууц үг баталгаажуулах
            </label>
            <input
              [(ngModel)]="confirmPassword"
              type="password"
              name="confirmPassword"
              class="input-style w-full p-2.5 text-sm sm:text-base"
              placeholder="Нууц үгээ баталгаажуулна уу"
              required>
          </div>

          <!-- SUBMIT -->
          <button
            type="submit"
            class="w-full register-button
                   text-white font-medium
                   text-sm sm:text-base
                   px-5 py-2.5
                   rounded-lg
                   focus:ring-4 focus:ring-sky-300"
          >
            Бүртгүүлэх
          </button>

          <!-- LOGIN LINK -->
          <p class="text-sm text-center register-text">
            Бүртгэлтэй юу?
            <span
              class="font-medium underline cursor-pointer"
              (click)="goToLogin()"
            >
              Нэвтрэх
            </span>
          </p>

        </form>
      </div>
    </div>
  </div>

  <!-- RIGHT: BACKGROUND -->
  <div
    class="relative hidden lg:flex
           w-full lg:w-1/2
           h-screen
           register-background">
    <img
      src="../../../assets/images/register-background.png"
      class="object-cover w-full h-full"
      alt="Background"
    />
    <h1 class="main-logo">
      E-SORILGO.MN
    </h1>
  </div>

</section>
