<div
  (click)="onGetDetail()"
  [ngClass]="{
    'opacity-60': exam.status === 'locked' && this.role === 'student'
  }"
  class="h-24 w-48 max-w-sm rounded-lg shadow hover:cursor-pointer customized-card flex justify-center items-center"
  pBadge [value]="badgeValue ?? 0" severity="warning" [badgeDisabled]="badgeValue === null" badgeStyleClass="custom-badge"
>
  <div class="text-white text-2xl">{{ exam.examName }}</div>
</div>
