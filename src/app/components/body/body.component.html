<div class="container-body">
  <div class="flex justify-center">
    <h2 class="main-title">Сорилууд</h2>
  </div>
  <div class="flex justify-center p-8">
    <div class="exam-grid">
      <app-card *ngFor="let exam of exams; index as i" [exam]="exam" [badgeValue]="exam.score" [isFirst]="i === 0"></app-card>
      <app-card *ngIf="isAdmin" [exam]="adminExam"></app-card>
    </div>
  </div>
</div>
