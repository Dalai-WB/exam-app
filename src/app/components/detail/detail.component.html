<div class="flex h-screen" [formGroup]="examForm">
  <!-- Sidebar -->
  <div [ngClass]="{
      'block fixed z-40 top-0 left-0 h-full bg-primary-color w-64 px-4 pt-4 transition-transform duration-300': true,
      'translate-x-0': isSidebarOpen,
      '-translate-x-full': !isSidebarOpen,
      'lg:translate-x-0 lg:static': true
    }" class="custom-navbar">
    <!-- <div class="mb-2">
      <img src="../../../assets/images/main-black 2.svg" alt="Logo" width="180px" />
    </div> -->
    <nav class="p-4">
      <ul class="flex flex-wrap gap-3">
        <li *ngFor="let question of arr; let i = index" (click)="onPageClick(question)" [ngClass]="{
            'unanswered': !questions.controls[i].get('selectedAnswer')?.value,
            'correct': isReview && questions.controls[i].get('isCorrect')?.value === true,
            'incorrect': isReview && questions.controls[i].get('isCorrect')?.value === false
          }" class="cursor-pointer">
          <a [class]="pageIndex === question ? activePage : regularPage">
            {{ question }}
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Main Test Area -->
  <div class="flex-1 flex flex-col main-test-area relative overflow-auto">
    <!-- Top Navbar for Small Screens -->
    <div class="lg:hidden flex items-center justify-between p-4 bg-white border-b">
      <button (click)="toggleSidebar()" class="text-gray-700 focus:outline-none">
        <i class="pi pi-bars text-2xl"></i>
      </button>
      <h2 class="text-primary-color font-bold text-xl">{{ exam?.examName }}</h2>
      <div class="end-time border-2 border-primary-color p-1 rounded-md">
        <h2 class="text-xl text-black font-bold">{{ formattedTime }}</h2>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex flex-col justify-between flex-1">
      <!-- Exam Header -->
      <div class="hidden lg:flex items-center m-6 justify-between">
        <div class="border-2 border-primary-color p-2 rounded-md">
          <h2 class="text-xl text-primary-color font-bold p-1">{{ exam.examName }}</h2>
        </div>
        <div class="end-time border-2 border-primary-color p-2 rounded-md">
          <h2 class="text-xl text-black font-bold p-1">{{ formattedTime }}</h2>
        </div>
      </div>

      <!-- Question Content -->
      <div formArrayName="questions" class="custom-background flex items-center">
        <div class="w-full flex flex-col items-start py-6">
          <!-- Question Header -->
          <div
            class="w-96 sm:w-[48rem] lg:w-[56rem] mb-10 px-4 sm:px-8 lg:px-24 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
            <div class="flex gap-3 sm:gap-5 items-top border-y-4 border-primary-color rounded-md p-2 sm:p-3">
              <span
                class="flex items-center justify-center px-3 sm:px-4 h-10 w-10 sm:w-12 border bg-white border-primary-color text-primary-color text-lg rounded-md">
                {{ pageIndex }}
              </span>
              <span class="break-words max-w-full text-xl">
                <app-math-jax-paragraph
                  [mathString]="replaceDollarPairsRecursively(questionText)"></app-math-jax-paragraph>
              </span>
            </div>

            <!-- Button only in review -->
            <p-button *ngIf="isReview" class="ml-0 lg:ml-1 w-full lg:w-auto" label="Бодолт" [text]="true"
              severity="info" (click)="onAnswerClick()" />
          </div>

          <!-- Answer Section -->
          <div class="pl-4 sm:pl-8 lg:pl-24 w-64 sm:w-96 lg:w-[36rem]">
            <!-- Multiple Choice -->
            <ul *ngIf="!isFill" [formGroup]="arrFormGroup">
              <li *ngFor="let answer of answers; let i = index"
                class="flex flex-col sm:flex-row items-start sm:items-center custom-li w-full ml-0 sm:ml-6"
                [class.bg-blue-100]="arrFormGroup.controls['selectedAnswer'].value === answer">
                <label [for]="'horizontal-list-radio-license-' + i"
                  class="flex items-center w-full py-3 text-base sm:text-lg cursor-pointer">
                  <input [id]="'horizontal-list-radio-license-' + i" type="radio" [value]="answer"
                    formControlName="selectedAnswer" name="selectedAnswer"
                    class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:outline-none ms-3 cursor-pointer"
                    (keydown)="preventArrowKeys($event)" />
                  <div class="pl-2 w-full">
                    <app-math-jax-paragraph
                      [mathString]="replaceDollarPairsRecursively(answers[i])"></app-math-jax-paragraph>
                  </div>
                  <i *ngIf="isReview && getCheck(answer)" class="pi pi-check mr-3" style="color: green"></i>
                </label>
              </li>
            </ul>

            <!-- Fill in the Blank -->
            <div *ngIf="isFill" [formGroup]="arrFormGroup" class="flex items-center gap-10 mt-4">
              <div *ngIf="!isReview">
                <div *ngFor="let item of fillTypeKeyControlsList; let i = index" class="mb-2 flex items-center">
                  <div class="min-w-12 w-12 text-right mr-1">
                    <label [for]="i">{{ item.key }} :</label>
                  </div>
                  <input [id]="i" pInputText [formControl]="item.control" type="text">
                </div>
              </div>
              <div *ngIf="isReview">
                <div *ngFor="let item of fillTypeKeyControlsList; let i = index" class="mb-2 flex items-center">
                  <div class="min-w-12 w-12 text-right mr-1">
                    <label [for]="i">{{ item.key }} :</label>
                  </div>
                  <input [id]="i" pInputText [formControl]="item.control" [ngClass]="{
                      'p-invalid': item.control.errors?.['incorrect'],
                      'p-valid': item.control.errors?.['correct']
                    }" type="text" />
                  <i *ngIf="item.control.errors?.['incorrect']" class="pi pi-times ml-1" style="color: red"></i>
                  <i *ngIf="item.control.errors?.['correct']" class="pi pi-check ml-1" style="color: green"></i>
                </div>
              </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex justify-between ml-0 sm:ml-6 w-full">
              <a (click)="onPreviousClick()" class="btn-primary" [ngClass]="{'no-more': this.pageIndex === 1}">Өмнөх</a>
              <a (click)="onNextClick()" class="btn-primary" [ngClass]="{'no-more': pageIndex === exam.questions.length}">Дараах</a>
            </div>
          </div>
        </div>
      </div>
      <div class="flex justify-end mx-6 mb-5">
        <a (click)="finishExam()" class="btn-primary">
          Сорил дуусгах
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Dialog -->
<p-dialog header="Бодолт" [modal]="true" [(visible)]="isVisible" [style]="{ width: '60vw' }" (onShow)="rerenderMathjax()">
  <app-math-jax-paragraph #solutionMath [mathString]="answerString"></app-math-jax-paragraph>
</p-dialog>

<div class="fixed inset-0 bg-black opacity-50 z-30 lg:hidden" *ngIf="isSidebarOpen" (click)="isSidebarOpen = false">
</div>

<p-dialog header="Анхааруулга" [modal]="true" [(visible)]="warningVisible" [style]="{ width: '30rem' }">
  <span class="p-text-secondary block mb-8">Та сорил дуусгахад итгэлтэй байна уу?</span>
  <div class="flex justify-end gap-2">
    <p-button label="Үгүй" severity="secondary" (click)="warningVisible = false" />
    <p-button label="Тийм" (click)="warningVisible = false; endExam()" />
  </div>
</p-dialog>
