<div>
  <div class="flex">
    <app-sidebar></app-sidebar>
    <div class="statistic-container">
      <div class="card">
        <!-- Spinner Overlay -->
        <div class="spinner" [ngClass]="{ 'active': loading }">
          <p-progressSpinner
            *ngIf="loading"
            styleClass="w-4rem h-4rem"
            strokeWidth="8"
            fill="var(--surface-ground)"
            animationDuration=".5s"
          ></p-progressSpinner>
        </div>
      
        <!-- Chart Content -->
        <div class="chart-container" [style.opacity]="loading ? '0.5' : '1'">
          <div class="flex flex-col items-center gap-10">
            <p-selectButton 
            [options]="stateOptions" 
            [(ngModel)]="reqState" 
            name="role"
            optionLabel="label" 
            optionValue="value" 
            allowEmpty="false"
            (click)="onStateChange()" />
            <p-table [value]="pendingUsers" [tableStyle]="{ 'min-width': '50rem' }">
              <ng-template pTemplate="header">
                <tr>
                  <th>Нэвтрэх нэр</th>
                  <th>Үүрэг</th>
                  <!-- <th>Багшийн нэврэх нэр</th> -->
                  <th>Төлөв</th>
                  <th>Үйлдэл</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-user>
                <tr>
                  <td>{{ user.username }}</td>
                  <td>{{ translations[user.role] || user.role }}</td>
                  <!-- <td>{{ user.teacherId !== null ? user.teacherId.username : "" }}</td> -->
                  <td>{{ translations[user.status] || user.status }}</td>
                  <td>
                    <div class="flex gap-2">
                      <p-button
                        (click)="onApprove(user)"
                        icon="pi pi-check"
                        severity="success"
                        pTooltip="Зөвшөөрөх"
                      ></p-button>
                      <p-button
                        (click)="onDecline(user)"
                        icon="pi pi-times"
                        severity="danger"
                        pTooltip="Татгалзах"
                      ></p-button>
                    </div>
                  </td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </div>
      </div>      
    </div>
  </div>
</div>

<p-dialog header="Зөвшөөрөл" [modal]="true" [(visible)]="isVisible" [style]="{ width: '30rem' }">
  <div>
    <label for="duration" class="block mb-2 text-sm font-medium login-text">Эрх олгох хугацаа сараар</label>
    <input [(ngModel)]="duration" type="number" name="duration" id="duration"
      class="bg-gray-50 input-style text-gray-900 sm:text-sm block p-2.5" placeholder="name@company.com"
      required>
  </div>

  <div class="flex justify-end gap-2">
      <p-button label="Хадгалах" (click)="onApproveWithDuration()" />
  </div>
</p-dialog>
