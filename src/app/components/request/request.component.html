<div class="h-screen flex">
  <app-sidebar></app-sidebar>

  <div class="statistic-container flex-1">
    <div class="card w-full h-full flex flex-col relative">
      
      <!-- Spinner Overlay -->
      <div 
        class="spinner absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 
               bg-white/80 z-10 hidden items-center justify-center"
        [ngClass]="{ 'flex': loading, 'hidden': !loading }">

        <p-progressSpinner
          *ngIf="loading"
          styleClass="w-4rem h-4rem"
          strokeWidth="8"
          fill="var(--surface-ground)"
          animationDuration=".5s"
        ></p-progressSpinner>
      </div>

      <!-- Scrollable Content -->
      <div 
        class="chart-container flex-1 overflow-auto px-6 py-4 transition-opacity duration-300"
        [style.opacity]="loading ? '0.5' : '1'">

        <div class="flex flex-col items-center gap-10">

          <p-selectButton 
            [options]="stateOptions" 
            [(ngModel)]="reqState" 
            name="role"
            optionLabel="label" 
            optionValue="value" 
            allowEmpty="false"
            (click)="onStateChange()">
          </p-selectButton>

          <p-table [value]="pendingUsers" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
              <tr>
                <th>Нэвтрэх нэр</th>
                <th>Овог</th>
                <th>Нэр</th>
                <th>Утасны дугаар</th>
                <th>Үүрэг</th>
                <th>Төлөв</th>
                <th>Үйлдэл</th>
              </tr>
            </ng-template>

            <ng-template pTemplate="body" let-user>
              <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.lastName }}</td>
                <td>{{ user.firstName }}</td>
                <td>{{ user.phoneNumber }}</td>
                <td>{{ translations[user.role] || user.role }}</td>
                <td>{{ translations[user.status] || user.status }}</td>
                <td>
                  <div class="flex gap-2">
                    <p-button *ngIf="reqState === 'pending'"
                      (click)="onApprove(user)"
                      icon="pi pi-check"
                      severity="success"
                      pTooltip="Зөвшөөрөх">
                    </p-button>

                    <p-button
                      (click)="onDecline(user)"
                      icon="pi pi-times"
                      severity="danger"
                      pTooltip="Татгалзах">
                    </p-button>
                  </div>
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>

      </div>
    </div>
  </div>
</div>

<p-dialog header="Зөвшөөрөл" [modal]="true" [(visible)]="isVisible" [style]="{ width: '30rem' }">
  <div>
    <label for="duration" class="block mb-2 text-sm font-medium login-text">Эрх олгох хугацаа сараар</label>

    <input [(ngModel)]="duration" type="number" name="duration" id="duration"
      class="bg-gray-50 input-style text-gray-900 sm:text-sm block p-2.5"
      required>
  </div>

  <div class="flex justify-end gap-2">
    <p-button label="Хадгалах" (click)="onApproveWithDuration()" />
  </div>
</p-dialog>
