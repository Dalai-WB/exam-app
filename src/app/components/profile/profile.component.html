<div class="app-layout">
  <app-sidebar></app-sidebar>
  <div class="profile-container">
    <p-card class="profile-card" header="Миний Профайл">
      <!-- Top Section -->
      <div class="profile-top">
        <!-- Profile Image -->
        <div class="profile-pic">
          <img [src]="profilePicture" alt="Profile" class="profile-img" />
          <p-button label="Зураг оруулах" (click)="fileInput.click()" severity="secondary"></p-button>
          <input #fileInput type="file" style="display:none" accept="image/*" (change)="onFileSelect($event)" />
        </div>

        <!-- Form -->
        <div class="profile-form">
          <form [formGroup]="profileForm">
            <div class="form-field">
              <label for="name">Нэр</label>
              <input id="name" pInputText formControlName="name" />
            </div>
            <div class="form-field">
              <label for="email">И-майл</label>
              <input id="email" pInputText formControlName="email" [disabled]="true" />
            </div>
            <p-button label="Хадгалах" (onClick)="saveProfile()"></p-button>
          </form>
        </div>
      </div>

      <!-- Divider -->
      <p-divider align="center">
        <span class="p-tag">Шалгалтын үзүүлэлт</span>
      </p-divider>

      <!-- Stats Section -->
      <div class="stats-row">
        <div class="stats-card">
          <p-card header="Дуусгасан шалгалт">
            <h1 class="stat-value">{{ student.completedExams }}</h1>
          </p-card>
        </div>
        <div class="stats-card">
          <p-card header="Дундаж оноо">
            <h1 class="stat-value">{{ student.averageScore }}%</h1>
          </p-card>
        </div>
        <div class="stats-card">
          <p-card header="Нийт оноо">
            <h1 class="stat-value">{{ student.totalPoints }}</h1>
          </p-card>
        </div>
      </div>
    </p-card>
  </div>
</div>
